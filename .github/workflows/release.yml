name: Publish KwVPS release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Match the tag to the package version
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(bash kwvps --version)
          [[ "${GITHUB_REF_NAME}" == "v${version#KwVPS }" ]] || {
            printf 'Tag %s does not match %s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 2
          }
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats
      - name: Syntax and smoke tests
        run: bash tests/smoke.sh && bash tests/system-smoke.sh
      - name: APT download sandbox
        run: sudo bash tests/laravel-node-sandbox.sh
      - name: ShellCheck
        run: shellcheck -x kwvps install.sh upgrade.sh scripts/kwvps-launcher scripts/bootstrap-release.sh scripts/package-release.sh src/*.sh tests/*.sh
      - name: Bats
        run: bats tests/*.bats
      - name: Build and verify release package
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/package-release.sh "$GITHUB_REPOSITORY"
          (cd dist && sha256sum -c "kwvps-${GITHUB_REF_NAME#v}.tar.gz.sha256")
          python3 tests/cf_limit_ban_test.py
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/kwvps-${GITHUB_REF_NAME#v}.tar.gz" \
            "dist/kwvps-${GITHUB_REF_NAME#v}.tar.gz.sha256" \
            --verify-tag --latest \
            --title "KwVPS ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/RELEASE-NOTES-${GITHUB_REF_NAME#v}.md"
